<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('PDV - Ponto de Venda')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container-fluid px-4 py-4">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Catálogo de Bebidas para Selecionar -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0"><i class="bi bi-cart-plus me-2"></i>Catálogo de Bebidas</h4>
                        <input type="text" id="filterInput" class="form-control form-control-sm w-50" placeholder="Buscar no balcão...">
                    </div>

                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="productsGrid">
                        <div class="col product-card-col" th:each="p : ${products}" th:data-name="${#strings.toLowerCase(p.name)}">
                            <div class="card h-100 border shadow-sm p-3">
                                <div class="d-flex justify-content-between">
                                    <span class="badge bg-light text-dark border" th:text="${p.category}"></span>
                                    <span th:if="${p.stockQuantity <= p.minStock}" class="badge bg-danger" th:text="'Estoque: ' + ${p.stockQuantity}"></span>
                                    <span th:if="${p.stockQuantity > p.minStock}" class="badge bg-success" th:text="'Estoque: ' + ${p.stockQuantity}"></span>
                                </div>
                                <h6 class="fw-bold mt-2 mb-1" th:text="${p.name}"></h6>
                                <p class="small text-muted mb-2" th:text="${p.unitType}"></p>

                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="h5 fw-bold text-primary mb-0" th:text="'R$ ' + ${#numbers.formatDecimal(p.salePrice, 1, 'POINT', 2, 'COMMA')}"></div>
                                        <small class="text-success fw-bold" th:text="'+ R$ ' + ${#numbers.formatDecimal(p.unitProfit, 1, 'POINT', 2, 'COMMA')} + ' lucro'"></small>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-primary"
                                            th:disabled="${p.stockQuantity <= 0}"
                                            th:onclick="'addToCart(' + ${p.id} + ', \'' + ${#strings.escapeJavaScript(p.name)} + '\', ' + ${p.salePrice} + ', ' + ${p.costPrice} + ', ' + ${p.stockQuantity} + ')'">
                                        <i class="bi bi-plus-lg"></i> Adicionar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carrinho de Compras / Checkout -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 80px;">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-bag-check me-2"></i>Carrinho da Venda</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/pdv/finalizar}" method="post" id="checkoutForm">
                        <div id="cartItemsContainer" class="mb-3" style="max-height: 260px; overflow-y: auto;">
                            <p class="text-muted text-center py-4" id="emptyCartMsg">Nenhuma bebida adicionada ao pedido.</p>
                            <!-- Itens inseridos dinamicamente via JS -->
                        </div>

                        <hr>

                        <!-- Totais e Lucro -->
                        <div class="d-flex justify-content-between mb-1">
                            <span>Subtotal:</span>
                            <strong id="cartSubtotal">R$ 0,00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-success">
                            <span><strong>Lucro Previsto nesta Venda:</strong></span>
                            <strong id="cartProfit">+ R$ 0,00</strong>
                        </div>

                        <!-- Cliente -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Cliente:</label>
                            <select name="clientId" class="form-select form-select-sm">
                                <option value="">Consumidor Balcão / Avulso</option>
                                <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.tradeName} + ')'"></option>
                            </select>
                        </div>

                        <!-- Forma de Pagamento -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Condição de Pagamento:</label>
                            <select name="paymentMethod" class="form-select form-select-sm" required>
                                <option value="PIX">PIX (Instantâneo)</option>
                                <option value="DINHEIRO">Dinheiro / À Vista</option>
                                <option value="CARTAO_DEBITO">Cartão de Débito</option>
                                <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                                <option value="FATURADO_BOLETO">Faturado / Boleto a Prazo (Fiado)</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Desconto (R$):</label>
                                <input type="number" step="0.01" name="discount" id="discountInput" class="form-control form-control-sm" value="0.00">
                            </div>
                            <div class="col-6">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" name="isDelivery" id="deliveryCheck">
                                    <label class="form-check-label small fw-semibold" for="deliveryCheck">Entrega / Frete</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 d-none" id="deliveryAddressGroup">
                            <label class="form-label small fw-semibold">Endereço de Entrega:</label>
                            <input type="text" name="deliveryAddress" class="form-control form-control-sm" placeholder="Rua, número, bairro...">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-light rounded border">
                            <span class="h5 mb-0 fw-bold">Total a Pagar:</span>
                            <span class="h4 mb-0 fw-bold text-primary" id="cartTotal">R$ 0,00</span>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnFinish" disabled>
                            <i class="bi bi-check2-circle me-1"></i> Concluir Venda & Baixar Estoque
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    let cart = [];

    function addToCart(id, name, price, cost, maxStock) {
        let existing = cart.find(item => item.id === id);
        if (existing) {
            if (existing.quantity < maxStock) {
                existing.quantity++;
            } else {
                alert("Limite de estoque atingido para este item!");
            }
        } else {
            cart.push({ id, name, price, cost, maxStock, quantity: 1 });
        }
        renderCart();
    }

    function changeQty(id, delta) {
        let item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            } else if (item.quantity > item.maxStock) {
                item.quantity = item.maxStock;
                alert("Estoque máximo disponível: " + item.maxStock);
            }
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItemsContainer');
        const emptyMsg = document.getElementById('emptyCartMsg');
        const btnFinish = document.getElementById('btnFinish');
        const discountInput = document.getElementById('discountInput');
        const discount = parseFloat(discountInput.value) || 0;

        container.innerHTML = '';

        if (cart.length === 0) {
            container.appendChild(emptyMsg);
            emptyMsg.classList.remove('d-none');
            document.getElementById('cartSubtotal').textContent = 'R$ 0,00';
            document.getElementById('cartTotal').textContent = 'R$ 0,00';
            document.getElementById('cartProfit').textContent = '+ R$ 0,00';
            btnFinish.disabled = true;
            return;
        }

        emptyMsg.classList.add('d-none');
        btnFinish.disabled = false;

        let subtotal = 0;
        let totalCost = 0;

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            const itemCost = item.cost * item.quantity;
            subtotal += itemTotal;
            totalCost += itemCost;

            const div = document.createElement('div');
            div.className = 'd-flex justify-content-between align-items-center mb-2 p-2 border rounded bg-white';
            div.innerHTML = `
                <div style="max-width: 55%;">
                    <strong class="small d-block text-truncate">${item.name}</strong>
                    <span class="small text-muted">R$ ${item.price.toFixed(2)} un</span>
                    <input type="hidden" name="productIds" value="${item.id}">
                    <input type="hidden" name="quantities" value="${item.quantity}">
                </div>
                <div class="d-flex align-items-center">
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="changeQty(${item.id}, -1)">-</button>
                    <span class="mx-2 fw-bold small">${item.quantity}</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="changeQty(${item.id}, 1)">+</button>
                    <span class="ms-2 fw-bold text-primary small" style="min-width: 60px; text-align: right;">R$ ${itemTotal.toFixed(2)}</span>
                </div>
            `;
            container.appendChild(div);
        });

        const total = Math.max(0, subtotal - discount);
        const profit = Math.max(0, total - totalCost);

        document.getElementById('cartSubtotal').textContent = 'R$ ' + subtotal.toFixed(2);
        document.getElementById('cartTotal').textContent = 'R$ ' + total.toFixed(2);
        document.getElementById('cartProfit').textContent = '+ R$ ' + profit.toFixed(2);
    }

    document.getElementById('discountInput').addEventListener('input', renderCart);

    document.getElementById('deliveryCheck').addEventListener('change', function() {
        const group = document.getElementById('deliveryAddressGroup');
        if (this.checked) group.classList.remove('d-none');
        else group.classList.add('d-none');
    });

    document.getElementById('filterInput').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        document.querySelectorAll('.product-card-col').forEach(col => {
            const name = col.getAttribute('data-name');
            col.style.display = name.includes(q) ? '' : 'none';
        });
    });
</script>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
