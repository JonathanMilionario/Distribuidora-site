<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - DistriBebidas Web'">DistriBebidas Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary: #D97706;
            --bs-primary-rgb: 217, 119, 6;
        }
        .btn-primary {
            background-color: #D97706;
            border-color: #B45309;
        }
        .btn-primary:hover {
            background-color: #B45309;
            border-color: #92400E;
        }
        .text-primary {
            color: #D97706 !important;
        }
        .bg-primary-soft {
            background-color: rgba(217, 119, 6, 0.1);
        }
        .bg-success-soft {
            background-color: rgba(46, 125, 50, 0.12);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .card-stat {
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            transition: transform 0.15s ease-in-out;
        }
        .card-stat:hover {
            transform: translateY(-2px);
        }
        .badge-profit {
            background-color: #e8f5e9;
            color: #2e7d32;
            font-weight: 700;
        }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand text-warning" th:href="@{/}">
            <i class="bi bi-cup-straw me-2"></i>DistriBebidas <span class="badge bg-warning text-dark ms-1">Web</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/estoque}"><i class="bi bi-boxes me-1"></i> Estoque & Lucratividade</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pdv}"><i class="bi bi-cart-check me-1"></i> PDV / Nova Venda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cash}"><i class="bi bi-wallet2 me-1"></i> Caixa do Dia</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pedidos}"><i class="bi bi-receipt me-1"></i> Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people me-1"></i> Clientes & Fiado</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/movimentacoes}"><i class="bi bi-clock-history me-1"></i> Auditoria</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-light">
                <span class="badge bg-success me-2"><i class="bi bi-database me-1"></i>PostgreSQL</span>
                <span class="small text-secondary">v1.0 Spring Boot</span>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-4 bg-light mt-auto border-top">
    <div class="container text-center text-muted small">
        &copy; 2026 DistriBebidas Web - Sistema de Gestão para Distribuidora de Bebidas | Spring Boot 3 & PostgreSQL
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
